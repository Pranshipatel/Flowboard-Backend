sonar.projectKey=flowboard-eureka-server
sonar.projectName=FlowBoard Eureka Server
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.test.inclusions=src/test/java/**/*.java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports
sonar.exclusions=**/target/**,**/.mvn/**,**/mvnw,**/mvnw.cmd
sonar.coverage.exclusions=
sonar.issue.ignore.multicriteria=s1068dto,s1068entity,s1068exception,s1068clientdto
sonar.issue.ignore.multicriteria.s1068dto.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.s1068dto.resourceKey=**/dto/**/*.java
sonar.issue.ignore.multicriteria.s1068entity.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.s1068entity.resourceKey=**/entity/**/*.java
sonar.issue.ignore.multicriteria.s1068exception.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.s1068exception.resourceKey=**/exception/**/*.java
sonar.issue.ignore.multicriteria.s1068clientdto.ruleKey=java:S1068
sonar.issue.ignore.multicriteria.s1068clientdto.resourceKey=**/client/dto/**/*.java
sonar.host.url=http://localhost:9000
