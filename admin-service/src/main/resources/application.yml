server:
  port: ${ADMIN_SERVICE_PORT:8087}

spring:
  config:
    import: optional:file:../../.env[.properties]
  application:
    name: admin-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
